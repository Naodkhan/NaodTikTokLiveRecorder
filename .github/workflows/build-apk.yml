name: Build NaodTikTok Live Recorder APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Create Android project
        shell: bash
        run: |
          set -e

          mkdir -p app/src/main/java/com/naod/tiktokliverecorder
          mkdir -p app/src/main/res/layout
          mkdir -p app/src/main/res/values
          mkdir -p app/src/main/res/drawable

          cat > settings.gradle.kts <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }

          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }

          rootProject.name = "NaodTikTokLiveRecorder"
          include(":app")
          EOF

          cat > build.gradle.kts <<'EOF'
          plugins {
              id("com.android.application") version "8.7.3" apply false
          }
          EOF

          cat > gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          EOF

          cat > app/build.gradle.kts <<'EOF'
          plugins {
              id("com.android.application")
          }

          android {
              namespace = "com.naod.tiktokliverecorder"
              compileSdk = 35

              defaultConfig {
                  applicationId = "com.naod.tiktokliverecorder"
                  minSdk = 29
                  targetSdk = 35
                  versionCode = 1
                  versionName = "1.0"
              }

              buildTypes {
                  release {
                      isMinifyEnabled = false
                  }
              }

              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
          }
          EOF

          cat > app/src/main/res/values/strings.xml <<'EOF'
          <resources>
              <string name="app_name">NaodTikTok Live Recorder</string>
          </resources>
          EOF

          cat > app/src/main/res/values/styles.xml <<'EOF'
          <resources>
              <style name="AppTheme" parent="android:style/Theme.Material.NoActionBar">
                  <item name="android:fontFamily">sans</item>
                  <item name="android:colorAccent">#FF2D55</item>
                  <item name="android:windowLightStatusBar">false</item>
                  <item name="android:statusBarColor">#070B16</item>
                  <item name="android:navigationBarColor">#070B16</item>
              </style>
          </resources>
          EOF

          cat > app/src/main/res/drawable/ic_launcher.xml <<'EOF'
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="108dp"
              android:height="108dp"
              android:viewportWidth="108"
              android:viewportHeight="108">
              <path
                  android:fillColor="#FF2D55"
                  android:pathData="M0,0h108v108h-108z"/>
              <path
                  android:fillColor="#FFFFFF"
                  android:pathData="M40,25h14v38c0,7 5,12 12,12s12,-5 12,-12V25h14v38c0,15 -11,26 -26,26S40,78 40,63z"/>
          </vector>
          EOF

          cat > app/src/main/res/layout/activity_main.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>

          <ScrollView xmlns:android="http://schemas.android.com/apk/res/android"
              android:layout_width="match_parent"
              android:layout_height="match_parent"
              android:background="#070B16">

              <LinearLayout
                  android:layout_width="match_parent"
                  android:layout_height="wrap_content"
                  android:orientation="vertical"
                  android:padding="24dp">

                  <TextView
                      android:layout_width="wrap_content"
                      android:layout_height="wrap_content"
                      android:text="NaodTikTok"
                      android:textColor="#FFFFFF"
                      android:textSize="30sp"
                      android:textStyle="bold"/>

                  <TextView
                      android:layout_width="wrap_content"
                      android:layout_height="wrap_content"
                      android:text="LIVE RECORDER"
                      android:textColor="#FF2D55"
                      android:textSize="14sp"
                      android:textStyle="bold"/>

                  <TextView
                      android:id="@+id/status"
                      android:layout_width="match_parent"
                      android:layout_height="wrap_content"
                      android:layout_marginTop="35dp"
                      android:padding="20dp"
                      android:text="Ready"
                      android:textColor="#FFFFFF"
                      android:textSize="17sp"/>

                  <Button
                      android:id="@+id/startButton"
                      android:layout_width="match_parent"
                      android:layout_height="60dp"
                      android:layout_marginTop="20dp"
                      android:text="🔴 START RECORDING"
                      android:textSize="16sp"/>

                  <Button
                      android:id="@+id/stopButton"
                      android:layout_width="match_parent"
                      android:layout_height="60dp"
                      android:layout_marginTop="12dp"
                      android:enabled="false"
                      android:text="⏹ STOP RECORDING"
                      android:textSize="16sp"/>

                  <TextView
                      android:layout_width="match_parent"
                      android:layout_height="wrap_content"
                      android:layout_marginTop="30dp"
                      android:text="NaodTikTok Live Recorder\n\nScreen recording uses Android MediaProjection. Recordings are saved in the app's Movies/NaodTikTok folder.\n\nAudio uses the microphone. Android may prevent capture of protected audio from another application."
                      android:textColor="#9AA3B5"
                      android:textSize="14sp"/>

              </LinearLayout>
          </ScrollView>
          EOF

          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>

          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <uses-permission android:name="android.permission.RECORD_AUDIO"/>
              <uses-permission android:name="android.permission.POST_NOTIFICATIONS"/>
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE"/>
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE_MEDIA_PROJECTION"/>

              <application
                  android:allowBackup="true"
                  android:label="NaodTikTok Live Recorder"
                  android:theme="@style/AppTheme">

                  <activity
                      android:name=".MainActivity"
                      android:exported="true">

                      <intent-filter>
                          <action android:name="android.intent.action.MAIN"/>
                          <category android:name="android.intent.category.LAUNCHER"/>
                      </intent-filter>

                  </activity>

                  <service
                      android:name=".RecorderService"
                      android:exported="false"
                      android:foregroundServiceType="mediaProjection"/>

              </application>

          </manifest>
          EOF

          cat > app/src/main/java/com/naod/tiktokliverecorder/MainActivity.java <<'EOF'
          package com.naod.tiktokliverecorder;

          import android.Manifest;
          import android.app.Activity;
          import android.content.Intent;
          import android.content.pm.PackageManager;
          import android.media.projection.MediaProjectionManager;
          import android.os.Build;
          import android.os.Bundle;
          import android.widget.Button;
          import android.widget.TextView;

          public class MainActivity extends Activity {

              private static final int PERMISSION_REQUEST = 100;
              private static final int PROJECTION_REQUEST = 101;

              private TextView status;
              private Button startButton;
              private Button stopButton;

              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  setContentView(R.layout.activity_main);

                  status = findViewById(R.id.status);
                  startButton = findViewById(R.id.startButton);
                  stopButton = findViewById(R.id.stopButton);

                  startButton.setOnClickListener(v -> beginRecording());

                  stopButton.setOnClickListener(v -> {
                      Intent stop = new Intent(this, RecorderService.class);
                      stop.setAction(RecorderService.ACTION_STOP);
                      startService(stop);
                      setRecordingUi(false);
                  });
              }

              private void beginRecording() {

                  if (checkSelfPermission(Manifest.permission.RECORD_AUDIO)
                          != PackageManager.PERMISSION_GRANTED) {

                      if (Build.VERSION.SDK_INT >= 33) {
                          requestPermissions(
                              new String[] {
                                  Manifest.permission.RECORD_AUDIO,
                                  Manifest.permission.POST_NOTIFICATIONS
                              },
                              PERMISSION_REQUEST
                          );
                      } else {
                          requestPermissions(
                              new String[] {
                                  Manifest.permission.RECORD_AUDIO
                              },
                              PERMISSION_REQUEST
                          );
                      }

                      return;
                  }

                  requestProjection();
              }

              private void requestProjection() {

                  MediaProjectionManager manager =
                      (MediaProjectionManager)
                      getSystemService(MEDIA_PROJECTION_SERVICE);

                  Intent captureIntent =
                      manager.createScreenCaptureIntent();

                  startActivityForResult(
                      captureIntent,
                      PROJECTION_REQUEST
                  );
              }

              @Override
              protected void onRequestPermissionsResult(
                      int requestCode,
                      String[] permissions,
                      int[] results) {

                  super.onRequestPermissionsResult(
                      requestCode,
                      permissions,
                      results
                  );

                  if (requestCode == PERMISSION_REQUEST) {

                      if (checkSelfPermission(
                              Manifest.permission.RECORD_AUDIO)
                              == PackageManager.PERMISSION_GRANTED) {

                          requestProjection();

                      } else {
                          status.setText(
                              "Microphone permission is required."
                          );
                      }
                  }
              }

              @Override
              protected void onActivityResult(
                      int requestCode,
                      int resultCode,
                      Intent data) {

                  super.onActivityResult(
                      requestCode,
                      resultCode,
                      data
                  );

                  if (requestCode == PROJECTION_REQUEST) {

                      if (resultCode == RESULT_OK && data != null) {

                          Intent service =
                              new Intent(this, RecorderService.class);

                          service.setAction(
                              RecorderService.ACTION_START
                          );

                          service.putExtra(
                              RecorderService.EXTRA_RESULT_CODE,
                              resultCode
                          );

                          service.putExtra(
                              RecorderService.EXTRA_RESULT_DATA,
                              data
                          );

                          if (Build.VERSION.SDK_INT >= 26) {
                              startForegroundService(service);
                          } else {
                              startService(service);
                          }

                          setRecordingUi(true);

                      } else {
                          status.setText(
                              "Screen recording permission cancelled."
                          );
                      }
                  }
              }

              private void setRecordingUi(boolean recording) {

                  startButton.setEnabled(!recording);
                  stopButton.setEnabled(recording);

                  if (recording) {
                      status.setText(
                          "🔴 RECORDING\n\n" +
                          "You can now open TikTok LIVE."
                      );
                  } else {
                      status.setText(
                          "Ready — recording stopped."
                      );
                  }
              }
          }
          EOF

          cat > app/src/main/java/com/naod/tiktokliverecorder/RecorderService.java <<'EOF'
          package com.naod.tiktokliverecorder;

          import android.app.Notification;
          import android.app.NotificationChannel;
          import android.app.NotificationManager;
          import android.app.PendingIntent;
          import android.app.Service;
          import android.content.Context;
          import android.content.Intent;
          import android.media.MediaRecorder;
          import android.media.projection.MediaProjection;
          import android.media.projection.MediaProjectionManager;
          import android.os.Build;
          import android.os.Environment;
          import android.os.IBinder;
          import android.content.pm.ServiceInfo;

          import java.io.File;
          import java.text.SimpleDateFormat;
          import java.util.Date;
          import java.util.Locale;

          public class RecorderService extends Service {

              public static final String ACTION_START = "START_RECORDING";
              public static final String ACTION_STOP = "STOP_RECORDING";

              public static final String EXTRA_RESULT_CODE = "RESULT_CODE";
              public static final String EXTRA_RESULT_DATA = "RESULT_DATA";

              private static final String CHANNEL_ID =
                      "naod_tiktok_recording";

              private MediaRecorder recorder;
              private MediaProjection projection;

              @Override
              public void onCreate() {
                  super.onCreate();
                  createNotificationChannel();
              }

              @Override
              public int onStartCommand(
                      Intent intent,
                      int flags,
                      int startId) {

                  if (intent == null) {
                      return START_NOT_STICKY;
                  }

                  if (ACTION_START.equals(intent.getAction())) {

                      Intent data =
                          intent.getParcelableExtra(
                              EXTRA_RESULT_DATA
                          );

                      int resultCode =
                          intent.getIntExtra(
                              EXTRA_RESULT_CODE,
                              0
                          );

                      if (data != null && resultCode != 0) {
                          startRecording(resultCode, data);
                      }

                  } else if (ACTION_STOP.equals(intent.getAction())) {
                      stopRecording();
                  }

                  return START_NOT_STICKY;
              }

              private void startRecording(
                      int resultCode,
                      Intent data) {

                  if (recorder != null) {
                      return;
                  }

                  Notification notification =
                      createNotification();

                  if (Build.VERSION.SDK_INT >= 29) {

                      startForeground(
                          5001,
                          notification,
                          ServiceInfo
                              .FOREGROUND_SERVICE_TYPE_MEDIA_PROJECTION
                      );

                  } else {
                      startForeground(
                          5001,
                          notification
                      );
                  }

                  try {

                      MediaProjectionManager manager =
                          (MediaProjectionManager)
                          getSystemService(
                              MEDIA_PROJECTION_SERVICE
                          );

                      projection =
                          manager.getMediaProjection(
                              resultCode,
                              data
                          );

                      File directory =
                          new File(
                              getExternalFilesDir(
                                  Environment.DIRECTORY_MOVIES
                              ),
                              "NaodTikTok"
                          );

                      if (!directory.exists()) {
                          directory.mkdirs();
                      }

                      String time =
                          new SimpleDateFormat(
                              "yyyyMMdd_HHmmss",
                              Locale.US
                          ).format(new Date());

                      File output =
                          new File(
                              directory,
                              "NaodTikTok_LIVE_" +
                              time +
                              ".mp4"
                          );

                      if (Build.VERSION.SDK_INT >= 31) {
                          recorder =
                              new MediaRecorder(this);
                      } else {
                          recorder =
                              new MediaRecorder();
                      }

                      recorder.setVideoSource(
                          MediaRecorder.VideoSource.SURFACE
                      );

                      recorder.setAudioSource(
                          MediaRecorder.AudioSource.MIC
                      );

                      recorder.setOutputFormat(
                          MediaRecorder.OutputFormat.MPEG_4
                      );

                      recorder.setVideoEncoder(
                          MediaRecorder.VideoEncoder.H264
                      );

                      recorder.setAudioEncoder(
                          MediaRecorder.AudioEncoder.AAC
                      );

                      recorder.setVideoSize(
                          720,
                          1280
                      );

                      recorder.setVideoFrameRate(30);

                      recorder.setVideoEncodingBitRate(
                          5_000_000
                      );

                      recorder.setAudioEncodingBitRate(
                          128_000
                      );

                      recorder.setAudioSamplingRate(
                          44_100
                      );

                      recorder.setOutputFile(
                          output.getAbsolutePath()
                      );

                      recorder.prepare();

                      projection.createVirtualDisplay(
                          "NaodTikTokLiveRecorder",
                          720,
                          1280,
                          getResources()
                              .getDisplayMetrics()
                              .densityDpi,
                          0,
                          recorder.getSurface(),
                          null,
                          null
                      );

                      recorder.start();

                  } catch (Exception e) {

                      stopRecording();
                  }
              }

              private void stopRecording() {

                  if (recorder != null) {

                      try {
                          recorder.stop();
                      } catch (Exception ignored) {
                      }

                      try {
                          recorder.release();
                      } catch (Exception ignored) {
                      }

                      recorder = null;
                  }

                  if (projection != null) {

                      try {
                          projection.stop();
                      } catch (Exception ignored) {
                      }

                      projection = null;
                  }

                  stopForeground(
                      STOP_FOREGROUND_REMOVE
                  );

                  stopSelf();
              }

              private void createNotificationChannel() {

                  NotificationManager manager =
                      (NotificationManager)
                      getSystemService(
                          Context.NOTIFICATION_SERVICE
                      );

                  NotificationChannel channel =
                      new NotificationChannel(
                          CHANNEL_ID,
                          "NaodTikTok Recording",
                          NotificationManager
                              .IMPORTANCE_LOW
                      );

                  manager.createNotificationChannel(
                      channel
                  );
              }

              private Notification createNotification() {

                  Intent stopIntent =
                      new Intent(
                          this,
                          RecorderService.class
                      );

                  stopIntent.setAction(
                      ACTION_STOP
                  );

                  PendingIntent stopPending =
                      PendingIntent.getService(
                          this,
                          20,
                          stopIntent,
                          PendingIntent.FLAG_UPDATE_CURRENT |
                          PendingIntent.FLAG_IMMUTABLE
                      );

                  return new Notification.Builder(
                          this,
                          CHANNEL_ID
                      )
                      .setContentTitle(
                          "NaodTikTok Live Recorder"
                      )
                      .setContentText(
                          "Recording LIVE screen…"
                      )
                      .setSmallIcon(
                          R.drawable.ic_launcher
                      )
                      .setOngoing(true)
                      .addAction(
                          new Notification.Action.Builder(
                              null,
                              "STOP",
                              stopPending
                          ).build()
                      )
                      .build();
              }

              @Override
              public void onDestroy() {

                  if (recorder != null) {
                      stopRecording();
                  }

                  super.onDestroy();
              }

              @Override
              public IBinder onBind(Intent intent) {
                  return null;
              }
          }
          EOF

          gradle wrapper --gradle-version 8.9

      - name: Build APK
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: NaodTikTokLiveRecorder-APK
          path: app/build/outputs/apk/debug/app-debug.apk
